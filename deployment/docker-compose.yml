services:
  app:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: secureflow_app
    command: gunicorn -c deployment/gunicorn_config.py app.main:app
    expose:
      - "8000"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: secureflow_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: always